<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYONI-CMD-MAKER PRO V2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #ff4500; --secondary: #00d2ff; --bg: #0a0a0a; --card: #151515; }
        body { background: var(--bg); color: #fff; font-family: 'Orbitron', sans-serif; padding: 20px; }
        
        .main-box { 
            max-width: 900px; margin: auto; background: var(--card); padding: 30px; 
            border-radius: 25px; border: 2px solid var(--primary); 
            box-shadow: 0 0 40px rgba(255, 69, 0, 0.2); position: relative;
        }

        .top-controls { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        select { background: #222; color: #fff; border: 1px solid var(--primary); padding: 10px; border-radius: 8px; cursor: pointer; font-family: 'Rajdhani'; }

        h1 { color: var(--primary); text-transform: uppercase; letter-spacing: 3px; font-size: 1.8rem; margin-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        
        .input-group { text-align: left; }
        label { display: block; margin-bottom: 8px; color: var(--secondary); font-size: 0.8em; font-weight: bold; }
        input, textarea, select.full { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--secondary); box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); }

        #imgPreview { width: 100%; max-height: 150px; object-fit: contain; border-radius: 10px; margin-top: 10px; display: none; border: 1px dashed var(--primary); }

        .gen-btn { 
            width: 100%; padding: 20px; background: linear-gradient(45deg, #ff4500, #ff8c00); 
            color: white; border: none; border-radius: 12px; font-weight: 900; 
            cursor: pointer; font-size: 1.3em; margin-top: 25px; transition: 0.4s;
            text-transform: uppercase;
        }
        .gen-btn:hover { letter-spacing: 2px; box-shadow: 0 0 30px var(--primary); transform: scale(1.01); }

        /* Code Display Area */
        #code-display { 
            margin-top: 30px; background: #000; padding: 20px; border-radius: 12px; 
            border: 2px solid #333; position: relative; display: none;
            max-height: 500px; overflow-y: auto;
        }
        pre { margin: 0; color: #00ffcc; font-family: 'Consolas', monospace; font-size: 0.9em; line-height: 1.5; white-space: pre-wrap; }
        
        .copy-btn {
            position: absolute; top: 10px; right: 10px; background: var(--primary);
            border: none; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer;
        }

        .channel-link { 
            display: inline-block; margin-top: 25px; color: #25d366; text-decoration: none; 
            font-weight: bold; border: 2px solid #25d366; padding: 12px 30px; border-radius: 50px; 
            transition: 0.3s;
        }
        .channel-link:hover { background: #25d366; color: #000; }
    </style>
</head>
<body>

<div class="main-box">
    <div class="top-controls">
        <select id="langSelect" onchange="changeLang()">
            <option value="en">🇺🇸 English</option>
            <option value="sw">🇹🇿 Kiswahili</option>
        </select>
    </div>

    <h1 id="titleText">⚔️ NYONI-CMD-MAKER PRO ⚔️</h1>
    <p id="subText" style="color: #888;">Professional Plugin Generator for WhatsApp Bots</p>

    <div class="grid">
        <div class="input-group">
            <label id="lblBot">Bot Name:</label>
            <input type="text" id="botName" placeholder="MORTAL-KOMBAT-XR">
        </div>
        <div class="input-group">
            <label id="lblOwner">Owner Name:</label>
            <input type="text" id="ownerName" placeholder="Nyoni XMD">
        </div>
        <div class="input-group">
            <label id="lblNum">Owner Number (With Country Code):</label>
            <input type="text" id="ownerNum" placeholder="2557XXXXXXXX">
        </div>
        <div class="input-group">
            <label id="lblImg">Thumbnail Image URL:</label>
            <input type="text" id="imgUrl" placeholder="https://catbox.moe/..." oninput="previewImage()">
            <img id="imgPreview" src="" alt="Preview">
        </div>
    </div>

    <hr style="margin: 25px 0; border: 0; border-top: 1px solid #333;">

    <div class="input-group">
        <label id="lblType">Select Plugin Mode:</label>
        <select id="cmdType" class="full">
            <option value="speed">⚡ Ultra-Fast Speed Test (Ping)</option>
            <option value="list">📜 Advanced Menu List (Auto-Numbered)</option>
        </select>
    </div>

    <div class="grid" style="margin-top: 20px;">
        <div class="input-group">
            <label id="lblTrig">Main Trigger (Command):</label>
            <input type="text" id="cmdTrigger" placeholder="menu2">
        </div>
        <div class="input-group">
            <label id="lblReact">Reaction Emoji:</label>
            <input type="text" id="cmdReact" placeholder="🔥">
        </div>
    </div>

    <div class="input-group" style="margin-top: 20px;">
        <label id="lblDesc">Command List Content (If using List Mode):</label>
        <textarea id="cmdDesc" rows="4" placeholder="Alive, Menu, Ping, Restart, Owner..."></textarea>
    </div>

    <button class="gen-btn" onclick="generateCode()" id="btnText">COMPILE PLUGIN</button>

    <div id="code-display">
        <button class="copy-btn" onclick="copyToClipboard()"><i class="fas fa-copy"></i> Copy</button>
        <pre><code id="jsCode"></code></pre>
    </div>

    <a href="https://whatsapp.com/channel/0029VbAffhD2ZjChG9DX922r" target="_blank" class="channel-link" id="btnJoin">
        <i class="fab fa-whatsapp"></i> JOIN NYONI CHANNEL
    </a>
</div>

<script>
    const langData = {
        en: { title: "⚔️ NYONI-CMD-MAKER PRO ⚔️", sub: "Professional Plugin Generator", bot: "Bot Name:", owner: "Owner Name:", num: "Owner Number:", img: "Thumbnail Image URL:", type: "Select Plugin Mode:", trig: "Main Trigger:", desc: "Command List Content:", btn: "COMPILE PLUGIN", join: "JOIN NYONI CHANNEL", alert: "Please enter a command trigger!", copied: "Plugin Copied to Clipboard! ✅" },
        sw: { title: "⚔️ NYONI-CMD-MAKER PRO ⚔️", sub: "Tengeneza Plugins za Uhakika", bot: "Jina la Bot:", owner: "Jina la Boss:", num: "Namba ya Simu:", img: "Picha ya Plugin (URL):", type: "Chagua Aina ya Plugin:", trig: "Neno la Amri:", desc: "Orodha ya Amri (Menu):", btn: "TENGENEZA KODI", join: "JIUNGE NA CHANNEL", alert: "Tafadhali weka neno la amri!", copied: "Kodi imekopiwa! Weka kwenye file jipya la .js ✅" }
    };

    function changeLang() {
        const l = document.getElementById('langSelect').value;
        const d = langData[l];
        document.getElementById('titleText').innerText = d.title;
        document.getElementById('subText').innerText = d.sub;
        document.getElementById('lblBot').innerText = d.bot;
        document.getElementById('lblOwner').innerText = d.owner;
        document.getElementById('lblNum').innerText = d.num;
        document.getElementById('lblImg').innerText = d.img;
        document.getElementById('lblType').innerText = d.type;
        document.getElementById('lblTrig').innerText = d.trig;
        document.getElementById('lblDesc').innerText = d.desc;
        document.getElementById('btnText').innerText = d.btn;
        document.getElementById('btnJoin').innerHTML = `<i class="fab fa-whatsapp"></i> ` + d.join;
    }

    function previewImage() {
        const url = document.getElementById('imgUrl').value;
        const preview = document.getElementById('imgPreview');
        if(url) { preview.src = url; preview.style.display = "block"; }
        else { preview.style.display = "none"; }
    }

    function generateCode() {
        const l = document.getElementById('langSelect').value;
        const bot = document.getElementById('botName').value || "MORTAL-KOMBAT-XR";
        const owner = document.getElementById('ownerName').value || "Nyoni XMD";
        const num = document.getElementById('ownerNum').value || "255";
        const img = document.getElementById('imgUrl').value || "https://files.catbox.moe/k3h99y.jpg";
        const trigger = document.getElementById('cmdTrigger').value.trim().toLowerCase();
        const react = document.getElementById('cmdReact').value || "⚔️";
        const type = document.getElementById('cmdType').value;
        const rawList = document.getElementById('cmdDesc').value;

        if(!trigger) return alert(langData[l].alert);

        let logic = "";
        if(type === 'speed') {
            logic = `
    const start = new Date().getTime();
    const { key } = await conn.sendMessage(from, { text: '*🚀 Testing Latency...*' }, { quoted: mek });
    const end = new Date().getTime();
    const ping = end - start;
    const message = \`┏━━━━━━━「 *SPEED* 」━━━━━━━┓
┃
┃ ⚡ *Ping:* \${ping}ms
┃ 👤 *User:* \${pushName}
┃ 🤖 *Bot:* ${bot}
┃ 👑 *Owner:* ${owner}
┃
┗━━━━━━━━━━━━━━━━━━━━━━━━┛\`;
    await conn.sendMessage(from, { text: message, edit: key });`;
        } else {
            const listArr = rawList.split(',').filter(i => i.trim() !== "");
            let listItems = "";
            listArr.forEach((item, index) => {
                listItems += `┃ \${index + 1}. 🔥 *${item.trim().toUpperCase()}*\\n`;
            });
            
            logic = `
    const listBody = \`┏━━━━━━━「 *MENU* 」━━━━━━━┓
┃
┃ 👤 *Hello:* \${pushName}
┃ 📞 *Contact:* ${num}
┃ 🤖 *Core:* ${bot}
┃
*───「 COMMANDS 」───*
${listItems ? listItems : '┃ (No commands added)'}
┃
┗━━━━━━━━━━━━━━━━━━━━┛\`;
    await conn.sendMessage(from, { text: listBody }, { quoted: mek });`;
        }

        const finalJS = `const { cmd, commands } = require('../command');

cmd({
    pattern: "${trigger}",
    react: "${react}",
    category: "generated",
    desc: "Auto-generated by Nyoni Maker",
    filename: __filename
}, async (conn, mek, m, { from, pushName, reply }) => {
    try {
        ${logic}
        
        // Ad-Reply Footer (Image Card)
        await conn.sendMessage(from, { 
            contextInfo: {
                externalAdReply: {
                    title: "${bot}",
                    body: "Created by ${owner}",
                    thumbnailUrl: "${img}",
                    sourceUrl: "https://whatsapp.com/channel/0029VbAffhD2ZjChG9DX922r",
                    mediaType: 1,
                    renderLargerThumbnail: true
                }
            }
        });
    } catch (e) { 
        console.log(e);
        reply("❌ Error occurred!");
    }
});`;

        document.getElementById('jsCode').textContent = finalJS;
        document.getElementById('code-display').style.display = "block";
        window.scrollTo(0, document.body.scrollHeight);
    }

    function copyToClipboard() {
        const l = document.getElementById('langSelect').value;
        const code = document.getElementById('jsCode').textContent;
        navigator.clipboard.writeText(code).then(() => {
            alert(langData[l].copied);
        });
    }
</script>

</body>
</html>
